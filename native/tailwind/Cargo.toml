[package]
name = "tailwind"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "A Tailwind CSS compiler in one file"
repository = "https://github.com/sntran/tailwind.com"

[lib]
name = "tailwind"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "tailwind"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line program: the scanner of Tailwind CSS, and Lightning CSS
# for --minify and --optimize.
cli = ["dep:tailwindcss-oxide", "dep:lightningcss", "dep:serde_json"]
# The build of tailwind.com (scripts/build.sh): the file events of
# c_src/watch.c are linked into the program.
ape = ["cli"]

[dependencies]
indexmap = "2"
# The scanner of Tailwind CSS, from the same release as the compiler.
tailwindcss-oxide = { git = "https://github.com/tailwindlabs/tailwindcss.git", tag = "v4.3.5", optional = true }
# The version that the npm package lightningcss 1.33.0 has: the optimizer
# of Tailwind CSS 4.3.5.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
