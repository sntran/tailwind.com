[package]
name = "tailwind"
version.workspace = true
edition = "2021"
# The fork of the crate ignore in the scanner needs 1.88.
rust-version = "1.88"
license = "Apache-2.0"
description = "A Tailwind CSS 4 compiler in Rust, with each version of Tailwind CSS 4 from 4.0.0"
repository.workspace = true
readme = "README.md"
keywords = ["tailwindcss", "tailwind", "css", "compiler"]
categories = ["web-programming", "compilers"]
# The files of the crate on crates.io. The tests read the records of the
# repository (tests/upstream), so they are not in the crate. Of QuickJS,
# only the files that build.rs compiles, and their headers.
include = [
    "/Cargo.toml",
    "/README.md",
    "/build.rs",
    "/src/**/*.rs",
    "/assets/**",
    "/c_src/js.c",
    "/c_src/js.h",
    "/c_src/wasi/setjmp.h",
    "/c_src/quickjs/quickjs.c",
    "/c_src/quickjs/libregexp.c",
    "/c_src/quickjs/libunicode.c",
    "/c_src/quickjs/cutils.c",
    "/c_src/quickjs/dtoa.c",
    "/c_src/quickjs/*.h",
    "/c_src/quickjs/VERSION",
    "/c_src/quickjs/LICENSE",
]

build = "build.rs"

[lib]
name = "tailwind"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "tailwind"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line program: the scanner of Tailwind CSS, and Lightning CSS
# for --minify and --optimize.
cli = ["dep:tailwindcss-oxide", "dep:lightningcss", "dep:serde_json", "dep:parcel_sourcemap", "js"]
# `@plugin` and `@config`: the QuickJS engine (c_src/quickjs, c_src/js.c)
# and the plugin layer of Tailwind CSS (assets/compat.js). build.rs
# compiles the C files. For wasm32-wasip1 it needs WASI_SDK_PATH: with no
# wasi-sdk, the program has no JavaScript.
js = ["dep:serde_json", "dep:cc"]
# The build of tailwind.com (scripts/build.sh): the file events of
# c_src/watch.c are linked into the program. scripts/build.sh compiles the
# C files of the feature `js` with cosmocc, and build.rs compiles nothing.
ape = ["cli"]

[dependencies]
indexmap = "2"
# The scanner of Tailwind CSS, from the same release as the compiler: a
# copy in native/scanner (scripts/scanner.sh).
tailwindcss-oxide = { workspace = true, optional = true }
# The version that the npm package lightningcss 1.33.0 has: the optimizer
# of Tailwind CSS 4.3.5.
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["sourcemap"], optional = true }
# The source maps of Lightning CSS, for --map with --minify or --optimize:
# the version that Lightning CSS uses.
parcel_sourcemap = { version = "=2.1.1", optional = true }
# `preserve_order`: the sequence of the conditions of `exports` in a
# package.json has a meaning.
serde_json = { version = "1", optional = true, features = ["preserve_order"] }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
