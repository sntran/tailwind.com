name: Pages

# The site of tailwind.com on GitHub Pages (site/, docs/SITE.md).
#
# - The job "pages" of build.yml calls this workflow after each push to
#   main that passes the gates of a release. It deploys the artifact
#   "site" of that run: the site that the job "site" built and tested,
#   with tailwind.wasm of that commit.
# - The release job starts it (workflow_dispatch) after each release. A
#   run of workflow_dispatch, also a run by hand, deploys the artifact
#   "site" of the newest successful run of build.yml on main.
#
# Each deploy gets tailwind.wasm of each release again
# (scripts/releases.sh), so a new release is in the list of programs.
#
# The repository needs Pages with the source "GitHub Actions" (Settings,
# Pages).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the site
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # One deploy at a time, and a deploy that started ends.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The site of this run
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site
          path: build/site
      - name: The newest successful run on main
        id: run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$id" ] || { echo "No successful run of build.yml on main." >&2; exit 1; }
          echo "The site of the run $id."
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: The site of that run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site
          path: build/site
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The programs of the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/releases.sh build/releases
          node site/releases.mjs build/site build/releases
          rm -f build/site/screenshot.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
