name: Fuzz

# The live differential fuzzer (tests/fuzz/fuzz.mjs): random stylesheets,
# candidates and projects go to the official Tailwind CSS (the npm
# packages of the version of UPSTREAM) and to this compiler. Each run has
# a new seed, so each run tries new inputs. A difference fails the job,
# and the artifact "fuzz" has the case and its reduced form. See
# docs/TESTING.md.
#
# A push or a pull request runs it only when a file that the fuzzer tests
# changes: the compiler, the fuzzer, the records, the packages. The run of
# each night tests each version with a longer time. A pull request from a
# work branch of this repository (feat/, fix/, ci/) runs no job: the push
# of that branch already ran each job on the same commit.
on:
  push:
    branches: [main, "feat/**", "fix/**", "ci/**"]
    paths:
      - "native/**"
      - "c_src/**"
      - "tests/fuzz/**"
      - "tests/upstream/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "PACKAGES"
      - "UPSTREAM"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "native/**"
      - "c_src/**"
      - "tests/fuzz/**"
      - "tests/upstream/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "PACKAGES"
      - "UPSTREAM"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Each night, with a longer time.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: The seed (empty for a new one)
        type: string
        default: ""
      minutes:
        description: The time for new cases
        type: number
        default: 15

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Differential fuzz against the official Tailwind CSS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !(startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'ci/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Build the program and the builder
        run: cargo build --release --bin tailwind --example fuzz_build
      - name: The official packages
        run: sh tests/fuzz/install.sh "$RUNNER_TEMP/official"
      - name: Fuzz
        env:
          SEED: ${{ inputs.seed }}
          MINUTES: ${{ inputs.minutes || (github.event_name == 'schedule' && 45) || 10 }}
        run: |
          seed=${SEED:-$GITHUB_RUN_ID}
          echo "The seed is $seed. A run with the same seed tries the same cases."
          node tests/fuzz/fuzz.mjs \
            --official "$RUNNER_TEMP/official" \
            --builder target/release/examples/fuzz_build \
            --program target/release/tailwind \
            --seed "$seed" --cases 1000000 --projects 1000000 \
            --seconds $((MINUTES * 60)) --out build/fuzz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: fuzz
          path: build/fuzz

  # The script engine runs the official compiler of a package in the
  # JavaScript engine of the program (docs/VERSIONS.md). This job compares
  # it with the same compiler in Node.js, for some versions of Tailwind
  # CSS: a difference is a difference between the two JavaScript engines.
  # Only compiler cases: the command line program of an old version has
  # another scanner and another optimizer.
  script:
    name: The script engine with Tailwind CSS ${{ matrix.version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !(startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'ci/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version: ["4.0.17", "4.1.18", "4.2.4", "4.3.0", "4.3.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Build the program and the builder
        run: cargo build --release --bin tailwind --example fuzz_build
      - name: The official packages of the version
        run: sh tests/fuzz/install.sh "$RUNNER_TEMP/official" "${{ matrix.version }}"
      - name: Fuzz
        env:
          SEED: ${{ inputs.seed }}
          MINUTES: ${{ (github.event_name == 'schedule' && 15) || 4 }}
          FUZZ_ENGINE: script
        run: |
          seed=${SEED:-$GITHUB_RUN_ID}
          echo "The seed is $seed. A run with the same seed tries the same cases."
          node tests/fuzz/fuzz.mjs \
            --official "$RUNNER_TEMP/official" \
            --builder target/release/examples/fuzz_build \
            --program target/release/tailwind \
            --seed "$seed" --cases 1000000 --projects 0 \
            --seconds $((MINUTES * 60)) --out build/fuzz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: fuzz-script-${{ matrix.version }}
          path: build/fuzz

  # The program and the builder for the job "switches": one build for all
  # its versions.
  programs:
    name: Build the program and the builder
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !(startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'ci/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Build the program and the builder
        run: |
          cargo build --release --bin tailwind --example fuzz_build
          mkdir -p build/programs
          cp target/release/tailwind target/release/examples/fuzz_build build/programs/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-programs
          path: build/programs
          retention-days: 1

  # The Rust compiler as an older version (docs/SWITCHES.md): for each
  # version that it serves (from Version::OLDEST of src/version.rs to the
  # version before UPSTREAM), compare it with the official compiler of
  # that version. A difference is a behavior with no switch.
  switches:
    needs: programs
    name: The Rust compiler as Tailwind CSS ${{ matrix.version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        version:
          - "4.3.4"
          - "4.3.3"
          - "4.3.2"
          - "4.3.1"
          - "4.3.0"
          - "4.2.4"
          - "4.2.3"
          - "4.2.2"
          - "4.2.1"
          - "4.2.0"
          - "4.1.18"
          - "4.1.17"
          - "4.1.16"
          - "4.1.15"
          - "4.1.14"
          - "4.1.13"
          - "4.1.12"
          - "4.1.11"
          - "4.1.10"
          - "4.1.9"
          - "4.1.8"
          - "4.1.7"
          - "4.1.6"
          - "4.1.5"
          - "4.1.4"
          - "4.1.3"
          - "4.1.2"
          - "4.1.1"
          - "4.1.0"
          - "4.0.17"
          - "4.0.16"
          - "4.0.15"
          - "4.0.14"
          - "4.0.13"
          - "4.0.12"
          - "4.0.11"
          - "4.0.10"
          - "4.0.9"
          - "4.0.8"
          - "4.0.7"
          - "4.0.6"
          - "4.0.5"
          - "4.0.4"
          - "4.0.3"
          - "4.0.2"
          - "4.0.1"
          - "4.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fuzz-programs
          path: build/programs
      - name: The program and the builder
        run: chmod +x build/programs/tailwind build/programs/fuzz_build
      - name: The official packages of the version
        run: sh tests/fuzz/install.sh "$RUNNER_TEMP/official" "${{ matrix.version }}"
      - name: Fuzz
        env:
          SEED: ${{ inputs.seed }}
          MINUTES: ${{ (github.event_name == 'schedule' && 15) || 4 }}
        run: |
          seed=${SEED:-$GITHUB_RUN_ID}
          echo "The seed is $seed. A run with the same seed tries the same cases."
          node tests/fuzz/fuzz.mjs \
            --official "$RUNNER_TEMP/official" \
            --builder build/programs/fuzz_build \
            --program build/programs/tailwind \
            --seed "$seed" --cases 1000000 --projects 0 \
            --seconds $((MINUTES * 60)) --out build/fuzz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: fuzz-switches-${{ matrix.version }}
          path: build/fuzz
